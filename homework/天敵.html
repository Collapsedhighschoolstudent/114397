            <section class="enemy">
            <section class="enemies1">
            <h3>劍水蚤</h3>
            <p>劍水蚤是草履蟲的主要天敵之一，它們以草履蟲為食，對草履蟲的生存構成威脅。</p>
            </section>
            <section class="enemies2">
            <h3>魚苗</h3>
            <p>魚苗也會捕食草履蟲，特別是在幼魚階段，它們的食性較為廣泛。</p>
            </section>
             <section class="enemies3">
            <h3>輪蟲</h3>
            <p>輪蟲是另一種草履蟲的天敵，它們以草履蟲為食，對草履蟲的生存造成壓力。</p>
            </section>
            <section class="enemies4">
            <h3>變形蟲</h3>
            <p>變形蟲會伸出偽足（pseudopodia）將草履蟲包圍，並在體內形成食物泡進行消化。</p>
            </section></section>
